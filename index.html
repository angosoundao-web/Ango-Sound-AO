
<section class="artist-section" id="contas">
    <h2>Entra no AngoSound</h2>
    <p>Cria a tua conta e começa a tua experiência musical.</p>

    <form id="authForm">
        <input
            type="text"
            id="displayName"
            placeholder="Nome completo"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="O teu email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Palavra-passe (mínimo 8 caracteres)"
            minlength="8"
            required
        >

        <select id="accountType">
            <option value="listener">Sou ouvinte</option>
            <option value="artist">Sou artista</option>
        </select>

        <button type="submit" class="register">
            Criar conta
        </button>

        <button type="button" id="loginButton" class="login">
            Já tenho conta — Entrar
        </button>

        <p id="authMessage"></p>
    </form>
</section>
